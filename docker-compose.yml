---
# audio2report — Docker Compose
#
# Set environment variables to control paths:
#   INPUT_DIR  — folder containing the 'prime' audio subfolders (default: ./recordings)
#   OUTPUT_DIR — where outputs are written                       (default: ./output)
#   HF_TOKEN   — Hugging Face token for diarization (GPU/Intel services only)
#
# Which service do I want? See README's "Which Docker setup do I need?"
# for the full decision tree. Short version:
#   audio2report-cpu        no dedicated GPU, or unsure
#   audio2report-gpu        NVIDIA GPU
#   audio2report-intel      Intel Arc iGPU (transcription accelerated, diarization on CPU)
#   audio2report-intel-xpu  Intel Arc iGPU (transcription AND diarization accelerated)
#
# Examples:
#   docker compose run audio2report-cpu dual /data/in --out /data/out
#   docker compose run audio2report-gpu dual /data/in --out /data/out --diarize --config /app/configs/gpu_full.yaml
#   docker compose run audio2report-intel dual /data/in --out /data/out --config /app/configs/intel_gpu.yaml --diarize
#   docker compose run audio2report-intel-xpu dual /data/in --out /data/out --config /app/configs/intel_gpu.yaml --diarize

services:

  # -----------------------------------------------------------------------
  # CPU service — no GPU required, suitable for any machine
  # -----------------------------------------------------------------------
  audio2report-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: audio2report:cpu
    volumes:
      - "${INPUT_DIR:-./recordings}:/data/in:ro"
      - "${OUTPUT_DIR:-./output}:/data/out"
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}

  # -----------------------------------------------------------------------
  # GPU service — requires NVIDIA Container Toolkit
  # -----------------------------------------------------------------------
  audio2report-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: audio2report:gpu
    volumes:
      - "${INPUT_DIR:-./recordings}:/data/in:ro"
      - "${OUTPUT_DIR:-./output}:/data/out"
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # -----------------------------------------------------------------------
  # Intel service — Intel Arc iGPU / NPU transcription via OpenVINO, with
  # CPU-only diarization. Requires Intel GPU/NPU drivers on the host.
  #
  # Device path depends on the host:
  #   - Bare-metal Linux: /dev/dri (active below).
  #   - WSL2: no /dev/dri exists — use /dev/dxg instead (confirmed working;
  #     comment out /dev/dri and uncomment /dev/dxg below), AND add a
  #     volumes entry for /usr/lib/wsl:/usr/lib/wsl (the container needs the
  #     host's dxcore/d3d12 shim libraries, not just the device node). Also
  #     needs an up-to-date Windows-host Intel graphics driver and a recent
  #     (2025+) compute-runtime in the image — see Dockerfile.intel's header
  #     comment.
  #
  #   Also want GPU-accelerated diarization? Use audio2report-intel-xpu
  #   below instead of this service — same image, same device/volume setup,
  #   just built differently. See README's "Which Docker setup do I need?"
  #   for the full picture.
  # -----------------------------------------------------------------------
  audio2report-intel:
    build:
      context: .
      dockerfile: Dockerfile.intel
    image: audio2report:intel
    volumes:
      - "${INPUT_DIR:-./recordings}:/data/in:ro"
      - "${OUTPUT_DIR:-./output}:/data/out"
      - huggingface_cache:/root/.cache/huggingface
      # - /usr/lib/wsl:/usr/lib/wsl   # WSL2 only — required alongside /dev/dxg below
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    devices:
      - /dev/dri:/dev/dri
      # - /dev/dxg:/dev/dxg   # WSL2 — use this instead of /dev/dri above
      # Intel NPU passthrough — only present on bare-metal Linux hosts with
      # the NPU kernel driver installed (not available under WSL2). Mapping
      # a host path that doesn't exist breaks `docker compose up`, so this
      # is commented out by default; uncomment on real NPU hardware.
      # - /dev/accel:/dev/accel

  # -----------------------------------------------------------------------
  # Intel service, XPU variant — identical to audio2report-intel above,
  # except diarization also runs on the Intel iGPU (via PyTorch's XPU
  # backend) instead of CPU. Worth it for anything beyond a single short
  # clip — real timing data in docs/INTEL_ACCELERATION_ROADMAP.md. Same
  # device/volume setup as audio2report-intel above (WSL2 notes apply here
  # too).
  # -----------------------------------------------------------------------
  audio2report-intel-xpu:
    build:
      context: .
      dockerfile: Dockerfile.intel
      args:
        TORCH_VARIANT: xpu
    image: audio2report:intel-xpu
    volumes:
      - "${INPUT_DIR:-./recordings}:/data/in:ro"
      - "${OUTPUT_DIR:-./output}:/data/out"
      - huggingface_cache:/root/.cache/huggingface
      # - /usr/lib/wsl:/usr/lib/wsl   # WSL2 only — required alongside /dev/dxg below
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    devices:
      - /dev/dri:/dev/dri
      # - /dev/dxg:/dev/dxg   # WSL2 — use this instead of /dev/dri above
      # - /dev/accel:/dev/accel   # Intel NPU — bare-metal Linux only, see above

volumes:
  huggingface_cache:
    # Named volume keeps model weights between runs — avoids re-downloading
    # on every container start.
