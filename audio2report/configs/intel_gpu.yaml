# audio2report — Intel Arc iGPU preset
# Runs Whisper on an Intel integrated GPU (e.g. Core Ultra "Series 3" / Panther
# Lake Arc iGPU) via OpenVINO. Requires: pip install "audio2report[intel]"
# and Intel GPU drivers/runtime on the host (see docs/INTEL_ACCELERATION_ROADMAP.md).

mode: dual
cache: true

audio:
  inter_file_gap_sec: 0.5
  min_duration_sec: 1.0

transcription:
  backend: openvino
  model: OpenVINO/whisper-large-v3-int4-ov   # HF repo id of a pre-converted OpenVINO IR model
  language: null
  device: gpu

diarization:
  enabled: true
  hf_token: null       # reads from HF_TOKEN environment variable

alignment:
  anchor_sim_threshold: 0.90
  min_anchor_text_len: 25

deduplication:
  enabled: true
  sim_threshold: 0.86
  time_tolerance_sec: 2.5
  min_text_len: 18

output:
  formats:
    - json
    - csv
    - txt
  include_suppressed: true

llm:
  enabled: false
  provider: ollama
  model: llama3
  base_url: "http://localhost:11434"
  prompt_template: audit_report
